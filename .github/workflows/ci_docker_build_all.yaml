name: CI-Docker-Build-All
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        include:
          - name: mybooks-web-apigateway
            dockerfile: ./src/MyBooks.ApiGateway/Dockerfile
          - name: mybooks-webui
            dockerfile: ./src/MyBooks.FrontendWASM/Dockerfile
          - name: mybooks-book-service
            dockerfile: ./src/MyBooks.BookService/Dockerfile
          - name: mybooks-bookmanagement-service
            dockerfile: ./src/MyBooks.BookManagementService/Dockerfile
          - name: mybooks-user-service
            dockerfile: ./src/MyBooks.UserService/Dockerfile
          - name: mybooks-mcp-service
            dockerfile: ./src/MyBooks.MCPServer/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push ${{ matrix.name }}
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation for ${{ matrix.name }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true